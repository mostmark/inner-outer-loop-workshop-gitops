{{- with .Values.pipelines.consolePlugins }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: console-plugins
  namespace: {{ $.Values.setupNamespace | quote }}
  labels:
    {{- include "workshop.labels" $ | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workshop-console-plugins
  labels:
    {{- include "workshop.labels" $ | nindent 4 }}
rules:
  - apiGroups: ["operator.openshift.io"]
    resources: ["consoles"]
    resourceNames: ["cluster"]
    verbs: ["get", "patch"]
  - apiGroups: ["console.openshift.io"]
    resources: ["consoleplugins"]
    verbs: ["get", "list"]
---
# Allows adding the Java 21 builder tag to openshift/java.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workshop-java-builder-tag
  namespace: openshift
  labels:
    {{- include "workshop.labels" $ | nindent 4 }}
rules:
  - apiGroups: ["image.openshift.io"]
    resources: ["imagestreams", "imagestreamtags", "imagestreamimports"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workshop-java-builder-tag
  namespace: openshift
  labels:
    {{- include "workshop.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workshop-java-builder-tag
subjects:
  - kind: ServiceAccount
    name: console-plugins
    namespace: {{ $.Values.setupNamespace | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workshop-console-plugins
  labels:
    {{- include "workshop.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: workshop-console-plugins
subjects:
  - kind: ServiceAccount
    name: console-plugins
    namespace: {{ $.Values.setupNamespace | quote }}
---
# Small additions to objects that belong to the cluster, so Argo CD cannot own them as a whole:
#   - Operators install their ConsolePlugin objects, but a plugin is only active once it is listed
#     in the cluster Console configuration (shared with other plugins). The Job appends the
#     missing workshop plugins.
#   - The openshift-pipelines s2i-java Task builds from openshift/java:<VERSION>. OpenShift 4.22
#     no longer ships a Java 21 tag in that image stream (owned by the Samples operator, which
#     leaves extra tags alone), so the Job adds one. ImageStreamTags cannot carry Argo CD's
#     tracking labels, which is why this is not a plain manifest.
apiVersion: batch/v1
kind: Job
metadata:
  name: cluster-integration
  namespace: {{ $.Values.setupNamespace | quote }}
  labels:
    {{- include "workshop.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    spec:
      serviceAccountName: console-plugins
      restartPolicy: OnFailure
      containers:
        - name: enable
          image: {{ $.Values.jobImage | quote }}
          env:
            - name: PLUGINS
              value: {{ join " " . | quote }}
            - name: JAVA_TAG
              value: {{ if $.Values.pipelines.javaBuilderTag.enabled }}{{ $.Values.pipelines.javaBuilderTag.name | quote }}{{ else }}""{{ end }}
            - name: JAVA_IMAGE
              value: {{ $.Values.pipelines.javaBuilderTag.image | quote }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              for plugin in $PLUGINS; do
                until oc get consoleplugin "$plugin" >/dev/null 2>&1; do echo "Waiting for ConsolePlugin $plugin"; sleep 10; done
                current=$(oc get consoles.operator.openshift.io cluster -o jsonpath='{.spec.plugins}')
                if echo "$current" | grep -q "\"$plugin\""; then
                  echo "$plugin already enabled"
                elif [ -z "$current" ]; then
                  oc patch consoles.operator.openshift.io cluster --type merge -p "{\"spec\":{\"plugins\":[\"$plugin\"]}}"
                else
                  oc patch consoles.operator.openshift.io cluster --type json -p "[{\"op\":\"add\",\"path\":\"/spec/plugins/-\",\"value\":\"$plugin\"}]"
                fi
              done
              if [ -n "$JAVA_TAG" ]; then
                oc tag --source=docker "$JAVA_IMAGE" "openshift/java:$JAVA_TAG" --reference-policy=local
              fi
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
{{- end }}
