{{- range $sub := include "workshop.enabledSubscriptions" . | fromYamlArray }}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: {{ $sub.name | quote }}
  namespace: {{ $sub.namespace | quote }}
  labels:
    {{- include "workshop.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  channel: {{ $sub.channel | quote }}
  installPlanApproval: {{ $sub.installPlanApproval | quote }}
  name: {{ $sub.package | quote }}
  source: {{ $sub.source | quote }}
  sourceNamespace: {{ $sub.sourceNamespace | quote }}
  {{- with $sub.startingCSV }}
  startingCSV: {{ . | quote }}
  {{- end }}
{{- end }}
